<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>筆順 · Порядок черт</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');
:root{--ink:#1a1008;--paper:#f5efe3;--paper-dark:#e8dfc8;--red:#c0392b;--gold:#9a7d3a;--sc:#2c1810;--fade:#c8b89a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'Cormorant Garamond','Noto Serif SC',serif;overflow-x:hidden;}
.grid-bg{position:fixed;inset:0;pointer-events:none;opacity:.06;background-image:repeating-linear-gradient(0deg,var(--gold) 0px,transparent 1px,transparent 80px),repeating-linear-gradient(90deg,var(--gold) 0px,transparent 1px,transparent 80px);}
.corner{position:fixed;width:50px;height:50px;opacity:.12;pointer-events:none;}
.corner.tl{top:16px;left:16px;border-top:2px solid var(--sc);border-left:2px solid var(--sc);}
.corner.tr{top:16px;right:16px;border-top:2px solid var(--sc);border-right:2px solid var(--sc);}
.corner.bl{bottom:16px;left:16px;border-bottom:2px solid var(--sc);border-left:2px solid var(--sc);}
.corner.br{bottom:16px;right:16px;border-bottom:2px solid var(--sc);border-right:2px solid var(--sc);}
.top-panel{padding:.5rem 1.5rem .3rem;}
header{text-align:center;padding-bottom:.4rem;}
header::after{content:'';display:block;margin:.45rem auto 0;width:130px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.title-zh{font-family:'Noto Serif SC',serif;font-size:clamp(1.3rem,3vw,2rem);font-weight:700;letter-spacing:.4em;color:var(--sc);}
.title-ru{font-size:.7rem;font-weight:300;letter-spacing:.22em;color:var(--gold);margin-top:.15rem;font-style:italic;text-transform:uppercase;}
.input-section{max-width:580px;margin:.5rem auto 0;padding:0;}
.input-wrapper{display:flex;gap:.55rem;}
.hanzi-input{flex:1;font-family:'Noto Serif SC',serif;font-size:1.25rem;padding:.5rem .85rem;background:rgba(255,255,255,.55);border:1px solid var(--fade);border-bottom:2px solid var(--gold);color:var(--ink);outline:none;letter-spacing:.15em;transition:all .3s;}
.hanzi-input:focus{background:rgba(255,255,255,.85);border-color:var(--gold);box-shadow:0 3px 14px rgba(154,125,58,.15);}
.hanzi-input::placeholder{color:var(--fade);font-size:.82rem;}
.go-btn{padding:.5rem 1rem;background:var(--sc);color:var(--paper);border:none;cursor:pointer;font-family:'Noto Serif SC',serif;font-size:.9rem;letter-spacing:.1em;transition:all .25s;}
.go-btn:hover{background:var(--red);}
.hint{text-align:center;margin-top:.28rem;font-size:.68rem;color:var(--fade);font-style:italic;}
.examples{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;margin-top:.28rem;}
.ex-tag{cursor:pointer;font-family:'Noto Serif SC',serif;font-size:.82rem;color:var(--gold);border-bottom:1px solid var(--fade);transition:color .2s;}
.ex-tag:hover{color:var(--red);}
.error-msg{text-align:center;color:var(--red);font-size:.72rem;margin-top:.2rem;min-height:.85em;}
.chars-nav{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;max-width:680px;margin:.45rem auto 0;padding:0 1rem;}
.char-pill{font-family:'Noto Serif SC',serif;width:48px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:rgba(255,255,255,.4);border:1px solid var(--fade);cursor:pointer;transition:all .25s;position:relative;padding:3px 2px;}
.char-pill .pill-char{font-size:1.15rem;line-height:1;}
.char-pill .pill-py{font-size:.5rem;color:var(--gold);font-style:italic;line-height:1;font-family:'Cormorant Garamond',serif;text-align:center;}
.char-pill.active{background:var(--sc);color:var(--paper);border-color:var(--sc);transform:scale(1.08);box-shadow:0 4px 14px rgba(44,24,16,.25);}
.char-pill.active .pill-py{color:rgba(245,239,227,.7);}
.char-pill.done::after{content:'✓';position:absolute;top:-5px;right:-5px;width:13px;height:13px;background:var(--gold);color:#fff;font-size:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}
.char-pill:not(.active):hover{background:rgba(255,255,255,.7);border-color:var(--gold);}
.stage{padding:.5rem 1rem 2rem;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.char-display-wrap{display:flex;flex-direction:column;align-items:center;animation:fadeUp .35s ease both;max-width:300px;margin:0 auto;}
.info-card{width:100%;margin-bottom:.7rem;background:rgba(255,255,255,.65);border:1px solid var(--fade);display:flex;align-items:center;gap:.8rem;padding:.6rem .85rem;box-shadow:0 2px 10px rgba(44,24,16,.06);}
.info-hanzi{font-family:'Noto Serif SC',serif;font-size:2.6rem;color:var(--sc);line-height:1;flex-shrink:0;}
.info-right{display:flex;flex-direction:column;gap:.18rem;}
.info-pinyin{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-style:italic;color:var(--gold);letter-spacing:.08em;line-height:1;}
.info-meaning{font-size:.8rem;color:var(--sc);opacity:.8;line-height:1.35;}
.info-unknown{font-size:.75rem;color:var(--fade);font-style:italic;}
.svg-wrap{position:relative;width:100%;max-width:300px;aspect-ratio:1;background:rgba(255,255,255,.5);border:1px solid var(--fade);box-shadow:0 0 0 6px rgba(255,255,255,.3),0 5px 28px rgba(44,24,16,.12);}
.svg-wrap::before,.svg-wrap::after{content:'';position:absolute;background:var(--gold);opacity:.15;pointer-events:none;}
.svg-wrap::before{width:1px;height:100%;left:50%;top:0;}
.svg-wrap::after{height:1px;width:100%;top:50%;left:0;}
.svg-wrap svg{position:absolute;inset:0;width:100%;height:100%;}
.stroke-counter{margin-top:.65rem;font-size:.78rem;color:var(--gold);letter-spacing:.15em;font-style:italic;min-height:1.2em;text-align:center;}
.controls{display:flex;gap:.55rem;margin-top:.9rem;flex-wrap:wrap;justify-content:center;}
.ctrl-btn{padding:.45rem .9rem;background:transparent;border:1px solid var(--fade);color:var(--ink);cursor:pointer;font-family:'Noto Serif SC',serif;font-size:.78rem;letter-spacing:.1em;transition:all .2s;}
.ctrl-btn:hover{border-color:var(--sc);background:rgba(44,24,16,.05);}
.ctrl-btn.primary{background:var(--sc);color:var(--paper);border-color:var(--sc);}
.ctrl-btn.primary:hover{background:var(--red);border-color:var(--red);}
.progress-bar{width:100%;max-width:300px;height:2px;background:var(--paper-dark);margin-top:.8rem;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .5s ease;}
.empty-state{text-align:center;padding:2.5rem 2rem;color:var(--fade);}
.big-char{font-family:'Noto Serif SC',serif;font-size:5rem;opacity:.15;display:block;margin-bottom:.8rem;animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.empty-state p{font-size:.88rem;line-height:1.8;}
.spinner{width:28px;height:28px;border:2px solid var(--paper-dark);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:1.2rem auto;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="top-panel">
<header>
  <div class="title-zh">笔顺</div>
  <div class="title-ru">Порядок черт</div>
</header>
<div class="input-section">
  <div class="input-wrapper">
    <input class="hanzi-input" id="hanziInput" type="text" placeholder="例：你好世界" maxlength="20" autocomplete="off"/>
    <button class="go-btn" onclick="loadChars()">写</button>
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="hint">Введите любые иероглифы — пиньинь, перевод и анимация черт</div>
  <div class="examples">
    <span class="ex-tag" onclick="setEx('你好')">你好</span>
    <span class="ex-tag" onclick="setEx('中国')">中国</span>
    <span class="ex-tag" onclick="setEx('山水')">山水</span>
    <span class="ex-tag" onclick="setEx('爱')">爱</span>
    <span class="ex-tag" onclick="setEx('龙')">龙</span>
    <span class="ex-tag" onclick="setEx('日月星')">日月星</span>
  </div>
</div>
<div class="chars-nav" id="charsNav"></div>
</div>
<div class="stage" id="stage">
  <div class="empty-state">
    <span class="big-char">字</span>
    <p>Введите иероглифы выше<br>и смотрите, как рисуются черты</p>
  </div>
</div>

// ── State ─────────────────────────────────────────────────────────────────
let chars=[], currentIdx=0, session=0, doneSet=new Set();
const strokeCache={}, infoCache={};

function isChinese(c){ return /[\u4e00-\u9fff\u3400-\u4dbf]/.test(c); }
function setEx(s){ document.getElementById('hanziInput').value=s; loadChars(); }

// ── Info lookup: dict first, then Claude API ───────────────────────────────
function getInfoFromDict(char){
  const entry=DICT[char];
  if(entry) return {pinyin:entry[0], meaning:entry[1]};
  return null;
}

async function fetchInfoFromAPI(chars){
  const needed=chars.filter(c=>!infoCache[c]&&!DICT[c]);
  if(!needed.length) return;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:600,
        messages:[{role:'user',content:
          'For each Chinese character give pinyin (tone marks) and short Russian translation (2-5 words). Characters: '+needed.join(' ')+
          '\nReply ONLY with JSON array, no markdown:\n[{"char":"字","pinyin":"zì","meaning":"иероглиф, символ"}]'
        }]
      })
    });
    if(!r.ok) return;
    const d=await r.json();
    let text=(d.content?.[0]?.text||'[]').trim().replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();
    JSON.parse(text).forEach(item=>{
      if(item.char) infoCache[item.char]={pinyin:item.pinyin||'',meaning:item.meaning||''};
    });
    renderNav();
    updateInfoCard();
  }catch(e){ /* offline — silent */ }
}

function resolveInfo(char){
  if(infoCache[char]) return infoCache[char];
  const d=getInfoFromDict(char);
  if(d){ infoCache[char]=d; return d; }
  return null;
}

function updateInfoCard(){
  const char=chars[currentIdx];
  const info=resolveInfo(char);
  if(!info) return;
  const pinEl=document.getElementById('infoPinyin');
  const meanEl=document.getElementById('infoMeaning');
  if(pinEl) pinEl.textContent=info.pinyin;
  if(meanEl){ meanEl.textContent=info.meaning; meanEl.className='info-meaning'; }
}

// ── Load & nav ─────────────────────────────────────────────────────────────
function loadChars(){
  const val=document.getElementById('hanziInput').value.trim();
  const err=document.getElementById('errorMsg');
  err.textContent='';
  const f=[...val].filter(isChinese);
  if(!f.length){ err.textContent='Введите китайские иероглифы'; return; }
  chars=f; currentIdx=0; doneSet=new Set();
  // pre-resolve dict; fetch API for unknowns
  chars.forEach(c=>resolveInfo(c));
  fetchInfoFromAPI(chars);
  renderNav(); showChar(0);
}

function renderNav(){
  const nav=document.getElementById('charsNav');
  nav.innerHTML='';
  chars.forEach((c,i)=>{
    const info=resolveInfo(c);
    const p=document.createElement('div');
    p.className='char-pill'+(i===currentIdx?' active':'')+(doneSet.has(i)?' done':'');
    p.innerHTML='<span class="pill-char">'+c+'</span><span class="pill-py">'+(info?.pinyin||'')+'</span>';
    p.onclick=()=>showChar(i);
    nav.appendChild(p);
  });
}

// ── Fetch stroke data ──────────────────────────────────────────────────────
async function fetchStrokeData(char){
  if(strokeCache[char]) return strokeCache[char];
  const url='https://raw.githubusercontent.com/chanind/hanzi-writer-data/master/data/'+encodeURIComponent(char)+'.json';
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  strokeCache[char]=d;
  return d;
}

// ── Show character ─────────────────────────────────────────────────────────
async function showChar(idx){
  currentIdx=idx; session++;
  const mySession=session;
  renderNav();

  const char=chars[idx];
  const isLast=idx===chars.length-1;
  const progress=Math.round((idx/chars.length)*100);
  const info=resolveInfo(char);

  const stage=document.getElementById('stage');
  stage.innerHTML='<div class="char-display-wrap">'
    +'<div class="info-card">'
    +'<div class="info-hanzi">'+char+'</div>'
    +'<div class="info-right">'
    +'<div class="info-pinyin" id="infoPinyin">'+(info?.pinyin||'…')+'</div>'
    +'<div class="'+(info?.meaning?'info-meaning':'info-unknown')+'" id="infoMeaning">'+(info?.meaning||'не в словаре')+'</div>'
    +'</div></div>'
    +'<div class="svg-wrap">'
    +'<svg id="hanziSvg" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">'
    +'<g id="outlineG" opacity="0.15"></g>'
    +'<g id="doneG"></g>'
    +'<path id="activePath" fill="none" stroke="#c0392b" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>'
    +'</svg></div>'
    +'<div class="stroke-counter" id="strokeCounter">Загрузка черт…</div>'
    +'<div class="controls">'
    +'<button class="ctrl-btn" onclick="replayChar()">↺ Повтор</button>'
    +'<button class="ctrl-btn" onclick="showAll()">Показать сразу</button>'
    +(isLast
      ?'<button class="ctrl-btn primary" onclick="finishAll()">✓ Готово</button>'
      :'<button class="ctrl-btn primary" onclick="nextChar()">Следующий →</button>')
    +'</div>'
    +'<div class="progress-bar"><div class="progress-fill" style="width:'+progress+'%"></div></div>'
    +'</div>';

  let data;
  try{
    data=await fetchStrokeData(char);
  }catch(e){
    if(session!==mySession) return;
    const sc=document.getElementById('strokeCounter');
    if(sc) sc.textContent='⚠ Нет данных черт для «'+char+'» (нужен интернет)';
    return;
  }
  if(session!==mySession) return;

  const {strokes,medians}=data;

  // Compute viewBox from median points (reliable centers of strokes)
  // After transform scale(1,-1) translate(0,-1024): data(x,y) → SVG(x, 1024-y)
  {
    let mxMin=9999,mxMax=-9999,myMin=9999,myMax=-9999;
    medians.forEach(pts => pts.forEach(([x,y]) => {
      if(x<mxMin) mxMin=x; if(x>mxMax) mxMax=x;
      if(y<myMin) myMin=y; if(y>myMax) myMax=y;
    }));
    const pad = 80; // covers stroke half-width + safety margin
    const vx  = mxMin - pad;
    const vw  = (mxMax - mxMin) + pad*2;
    // SVG Y is flipped: data yMax → SVG top, data yMin → SVG bottom
    const vy  = (1024 - myMax) - pad;
    const vh  = (myMax - myMin) + pad*2;
    const svg = document.getElementById('hanziSvg');
    if(svg) svg.setAttribute('viewBox', vx+' '+vy+' '+vw+' '+vh);
  }

  const og=document.getElementById('outlineG');
  if(og){
    og.setAttribute('transform','scale(1,-1) translate(0,-1024)');
    strokes.forEach(d=>{
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',d); p.setAttribute('fill','#8b6914'); p.setAttribute('stroke','none');
      og.appendChild(p);
    });
  }
  playStroke(mySession,strokes,medians,0);
}

// ── Easing & arc math ──────────────────────────────────────────────────────
function easeInOut(t){ return t<.5?2*t*t:-1+(4-2*t)*t; }

function buildArcTable(pts){
  const t=[0];
  for(let i=1;i<pts.length;i++){
    const dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1];
    t.push(t[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  return t;
}

function pointAtArc(pts,table,s){
  const total=table[table.length-1];
  s=Math.max(0,Math.min(s,total));
  for(let i=1;i<table.length;i++){
    if(table[i]>=s){
      const seg=table[i]-table[i-1],f=seg>0?(s-table[i-1])/seg:0;
      return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f];
    }
  }
  return pts[pts.length-1];
}

// ── Stroke animation ───────────────────────────────────────────────────────
function playStroke(mySession,strokes,medians,idx){
  if(session!==mySession) return;
  const sc=document.getElementById('strokeCounter');
  if(!sc) return;
  if(idx>=strokes.length){
    sc.textContent='✓ Все '+strokes.length+' '+plChert(strokes.length)+' нарисованы';
    doneSet.add(currentIdx); renderNav();
    const ap=document.getElementById('activePath');
    if(ap) ap.setAttribute('d','');
    const tip=document.getElementById('brushTip');
    if(tip) tip.setAttribute('opacity','0');
    return;
  }
  sc.textContent='Черта '+(idx+1)+' из '+strokes.length;
  const doneG=document.getElementById('doneG');
  if(!doneG) return;
  const pts=medians[idx];
  if(!pts||pts.length<2){ addDoneStroke(doneG,strokes[idx]); setTimeout(()=>playStroke(mySession,strokes,medians,idx+1),80); return; }

  const arcTable=buildArcTable(pts);
  const totalLen=arcTable[arcTable.length-1];
  const SAMPLES=100;
  const sampled=[];
  for(let i=0;i<=SAMPLES;i++) sampled.push(pointAtArc(pts,arcTable,(i/SAMPLES)*totalLen));

  const duration=Math.max(350,Math.min(950,totalLen*.95));
  const start=performance.now();
  const ap=document.getElementById('activePath');
  if(!ap||session!==mySession) return;

  const svg=document.getElementById('hanziSvg');
  let tip=document.getElementById('brushTip');
  if(!tip&&svg){
    tip=document.createElementNS('http://www.w3.org/2000/svg','circle');
    tip.setAttribute('id','brushTip');
    tip.setAttribute('r','26');
    tip.setAttribute('fill','#c0392b');
    svg.appendChild(tip);
  }

  function flipY(y){ return 1024-y; }

  function frame(now){
    if(session!==mySession){ ap.setAttribute('d',''); if(tip) tip.setAttribute('opacity','0'); return; }
    const raw=Math.min((now-start)/duration,1);
    const t=easeInOut(raw);
    const count=Math.max(2,Math.round(t*SAMPLES)+1);
    const p0=sampled[0];
    let d='M '+p0[0].toFixed(1)+' '+flipY(p0[1]).toFixed(1);
    for(let i=1;i<count;i++){
      const p=sampled[i];
      if(i===1){ d+=' L '+p[0].toFixed(1)+' '+flipY(p[1]).toFixed(1); }
      else{
        const prev=sampled[i-1];
        const mx=((prev[0]+p[0])/2).toFixed(1);
        const my=(flipY((prev[1]+p[1])/2)).toFixed(1);
        d+=' Q '+prev[0].toFixed(1)+' '+flipY(prev[1]).toFixed(1)+' '+mx+' '+my;
      }
    }
    ap.setAttribute('d',d);
    if(tip){
      const tipPt=sampled[Math.min(count-1,SAMPLES)];
      tip.setAttribute('cx',tipPt[0].toFixed(1));
      tip.setAttribute('cy',flipY(tipPt[1]).toFixed(1));
      tip.setAttribute('opacity',raw<.96?'.7':'0');
    }
    if(raw<1){ requestAnimationFrame(frame); }
    else{
      ap.setAttribute('d',''); if(tip) tip.setAttribute('opacity','0');
      addDoneStroke(doneG,strokes[idx]);
      setTimeout(()=>playStroke(mySession,strokes,medians,idx+1),200);
    }
  }
  requestAnimationFrame(frame);
}

function addDoneStroke(g,pathD){
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',pathD); p.setAttribute('fill','#2c1810'); p.setAttribute('stroke','none');
  p.setAttribute('transform','scale(1,-1) translate(0,-1024)');
  p.style.opacity='0'; p.style.transition='opacity .15s ease';
  g.appendChild(p);
  requestAnimationFrame(()=>{ p.style.opacity='1'; });
}

function replayChar(){ showChar(currentIdx); }
function nextChar(){ if(currentIdx<chars.length-1) showChar(currentIdx+1); }

function showAll(){
  session++;
  const data=strokeCache[chars[currentIdx]]; if(!data) return;
  const doneG=document.getElementById('doneG'); if(!doneG) return;
  const ap=document.getElementById('activePath');
  const tip=document.getElementById('brushTip');
  doneG.innerHTML='';
  if(ap) ap.setAttribute('d',''); if(tip) tip.setAttribute('opacity','0');
  data.strokes.forEach(d=>addDoneStroke(doneG,d));
  doneSet.add(currentIdx); renderNav();
  const sc=document.getElementById('strokeCounter');
  if(sc) sc.textContent='✓ Показано полностью';
}

function finishAll(){
  session++;
  document.getElementById('stage').innerHTML='<div class="empty-state"><span class="big-char" style="opacity:.4;font-size:4rem">✓</span><p style="font-size:1.1rem;color:var(--gold);margin-bottom:1rem;letter-spacing:.2em">学完了！</p><p>Все иероглифы пройдены.<br>Введите новое слово выше.</p></div>';
  chars.forEach((_,i)=>doneSet.add(i)); renderNav();
}

function plChert(n){
  if(n%10===1&&n%100!==11) return 'черта';
  if([2,3,4].includes(n%10)&&![12,13,14].includes(n%100)) return 'черты';
  return 'черт';
}

document.getElementById('hanziInput').addEventListener('keydown',e=>{ if(e.key==='Enter') loadChars(); });
</script>
